}

function openComposeFromScheduled(msgId, data) {
  composeState.to = (data.to_full || data.to || []).map(u => ({
    user_id: u.user_id, name: u.name, is_co_account: u.is_co_account,
    user_lt: String(u.user_lt || (u.is_co_account ? '2' : '0')),
    ss_id: u.ss_id,
  }));
  composeState.cc = (data.cc_full || data.cc || []).map(u => ({
    user_id: u.user_id, name: u.name, is_co_account: u.is_co_account,
    user_lt: String(u.user_lt || (u.is_co_account ? '2' : '0')),
    ss_id: u.ss_id,
  }));
  composeState.bcc = (data.bcc_full || data.bcc || []).map(u => ({
    user_id: u.user_id, name: u.name, is_co_account: u.is_co_account,
    user_lt: String(u.user_lt || (u.is_co_account ? '2' : '0')),
    ss_id: u.ss_id,
  }));
  composeState.attachments = [];
  composeState.editMode = { type: 'scheduled', msgId };

  $('compose-subject').value = data.subject || '';
  $('compose-body').innerHTML = data.body_html || '';

  if (composeState.cc.length || composeState.bcc.length) {
    $('cc-bcc-fields').classList.add('open');
    $('cc-bcc-toggle').classList.add('open');
  } else {
    $('cc-bcc-fields').classList.remove('open');
    $('cc-bcc-toggle').classList.remove('open');
  }

  if (data.send_date) {
    $('schedule-check').checked = true;
    $('schedule-row').style.display = 'flex';
    try {
      const dt = new Date(data.send_date);
      if (!isNaN(dt)) {
        const pad = n => String(n).padStart(2, '0');
        $('schedule-datetime').value =
          dt.getFullYear() + '-' + pad(dt.getMonth()+1) + '-' + pad(dt.getDate()) +
          'T' + pad(dt.getHours()) + ':' + pad(dt.getMinutes());
      }
    } catch {}
  } else {
    $('schedule-check').checked = false;
    $('schedule-row').style.display = 'none';
  }

  $('compose-title').textContent = 'Gepland bericht bewerken';
  $('compose-send').innerHTML = icon('send') + ' Bijwerken';
  $('compose-save-draft').innerHTML = icon('save') + ' Naar concept';
  renderRecipients('to');
  renderRecipients('cc');
  renderRecipients('bcc');
  renderAttachments();
  clearUploadStatus();
  savedRange = null;
  $('compose-modal').classList.add('show');
  refreshIcons();
  requestAnimationFrame(() => $('to-input').focus());
}

async function saveDraftHandler() {
  const subject = $('compose-subject').value.trim();
  const editor = $('compose-body');
  const html = editor.innerHTML.trim();
  const plain = editor.textContent.trim();

  if (!composeState.to.length) return toast('Voeg een ontvanger toe', 'error');
  if (!plain && !subject) return toast('Voeg inhoud toe', 'error');

  const btn = $('compose-save-draft');
  btn.disabled = true;
  btn.innerHTML = icon('loader') + ' Opslaan...';
  refreshIcons();
  try {
    const payload = {
      draft_id: composeState.editMode?.type === 'draft' ? composeState.editMode.msgId : '',
      subject: subject || '(geen onderwerp)',
      message_html: html || '<p></p>',
      to: composeState.to,
      cc: composeState.cc,
      bcc: composeState.bcc,
    };
    await api.messages.saveDraft(payload);
    toast('Concept opgeslagen', 'success');
    closeCompose();
    msgCache.invalidateList('draft');
    if (currentBox === 'draft') {
      _inflight.delete('msgs:draft');
      loadMessages('draft', true);
      renderEmptyView();
    }
  } catch (e) {
    toast('Opslaan mislukt: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    if (composeState.editMode?.type === 'draft') {
      btn.innerHTML = icon('save') + ' Concept opslaan';
    } else {
      btn.innerHTML = icon('save') + ' Opslaan als concept';
    }
    refreshIcons();
  }
}

async function sendCompose() {
  const subject = $('compose-subject').value.trim();
  const editor = $('compose-body');
  const html = editor.innerHTML.trim();
  const plain = editor.textContent.trim();

  if (!composeState.to.length) return toast('Voeg een ontvanger toe', 'error');
  if (!subject) return toast('Onderwerp is verplicht', 'error');
  if (!plain) return toast('Bericht is leeg', 'error');

  let sendDate = '';
  if ($('schedule-check').checked) {
    const dtVal = $('schedule-datetime').value;
    if (!dtVal) return toast('Kies een datum en tijd', 'error');
    sendDate = dtVal;
  }

  const btn = $('compose-send');
  btn.disabled = true;
  btn.innerHTML = icon('loader') + ' Versturen...';
  refreshIcons();
  try {
    if (composeState.editMode?.type === 'scheduled') {
      await api.messages.updateScheduled(composeState.editMode.msgId, {
        subject,
        message_html: html,
        to: composeState.to,
        cc: composeState.cc,
        bcc: composeState.bcc,
        send_date: sendDate || undefined,
      });
      toast('Gepland bericht bijgewerkt', 'success');
      closeCompose();
      msgCache.invalidateList('scheduled');
      if (currentBox === 'scheduled') {
        _inflight.delete('msgs:scheduled');
        loadMessages('scheduled', true);
        renderEmptyView();
      }
    } else {
      await api.messages.send({
        subject,
        message_html: html,
        to: composeState.to,
        cc: composeState.cc,
        bcc: composeState.bcc,
        attachments: composeState.attachments.map(a => ({
          url: a.url, filename: a.filename,
        })),
        send_date: sendDate,
        draft_id: composeState.editMode?.type === 'draft' ? composeState.editMode.msgId : '',
      });
      toast(sendDate ? 'Bericht ingepland' : 'Bericht verstuurd', 'success');
      closeCompose();
      if (currentBox === 'outbox') {
        _inflight.delete('msgs:outbox');
        loadMessages('outbox', true);
      } else if (currentBox === 'scheduled') {
        _inflight.delete('msgs:scheduled');
        loadMessages('scheduled', true);
      } else if (currentBox === 'draft') {
        _inflight.delete('msgs:draft');
        loadMessages('draft', true);
      }
    }
  } catch (e) {
    toast('Mislukt: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    if (composeState.editMode?.type === 'scheduled') {
      btn.innerHTML = icon('send') + ' Bijwerken';
    } else {
      btn.innerHTML = icon('send') + ' Versturen';
    }
    refreshIcons();
  }
}

/* ============================================================
   KEYBOARD
   ============================================================ */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    $('compose-modal').classList.remove('show');
    if (isMobile() && $('msg-view').classList.contains('mobile-open')) {
      closeMessageView();
    }
  }
});

/* ============================================================
   IMAGE FIX
   ============================================================ */
function fixRelativeImages(root) {
  if (!root) return;
  let host = '';
  try {
    host = (auth.creds?.main_url || '').replace(/^https?:\/\//, '').replace(/\/+$/, '');
  } catch {}
  if (!host) return;
  const imgs = root.querySelectorAll('img[src]');
  for (let i = 0; i < imgs.length; i++) {
    const img = imgs[i];
    const src = img.getAttribute('src');
    if (!src || /^(https?:|data:|blob:|\/\/)/i.test(src)) continue;
    img.src = 'https://' + host + (src[0] === '/' ? src : '/' + src);
  }
}

/* ============================================================
   RESIZE
   ============================================================ */
window.addEventListener('resize', () => {
  if (!isMobile()) closeMessageView();
  updateTabFades();
});

<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Smartschool Taken</title>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root {
    --bg:         #0d0d0f;
    --bg-2:       #121214;
    --bg-3:       #1a1a1d;
    --card:       #141416;
    --card-hover: #1c1c1f;
    --border:     #262629;
    --border-soft:#1d1d20;
    --text:       #e4e4e6;
    --text-dim:   #8a8a8e;
    --text-faint: #5a5a5e;
    --accent:     #2e2e33;
    --accent-hover:#3a3a40;
    --accent-soft: rgba(255,255,255,0.05);
    --green:      #4ade80;
    --red:        #f87171;
    --yellow:     #fbbf24;
    --purple:     #c084fc;
    --blue:       #60a5fa;
    --red-soft:   rgba(248,113,113,0.12);
    --purple-soft:rgba(192,132,252,0.14);
    --green-soft: rgba(74,222,128,0.14);
    --yellow-soft:rgba(251,191,36,0.14);
    --blue-soft:  rgba(96,165,250,0.14);
    --radius:     14px;
    --radius-sm:  9px;
    --shadow:     0 4px 24px rgba(0,0,0,0.55);
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  body.overlay-open { overflow: hidden; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #333338; }

  svg.lucide { width: 16px; height: 16px; stroke-width: 2; }

  @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

  #app { display: flex; height: 100vh; height: 100dvh; flex-direction: column; }

  .main { flex: 1; display: flex; overflow: hidden; min-height: 0; }
  .content { flex: 1; overflow: hidden; padding: 24px 28px; display: flex; flex-direction: column; min-height: 0; }

  .page-head {
    margin-bottom: 16px;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
    flex-shrink: 0;
  }
  .page-head h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .page-head p { color: var(--text-dim); font-size: 13px; margin-top: 3px; }

  .page-head-actions {
    display: flex; align-items: center; gap: 8px;
    flex-shrink: 0;
  }

  .btn-new {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 14px;
    background: #2a2a2e; color: var(--text);
    border: 1px solid #34343a; border-radius: 9px;
    font-size: 13px; font-weight: 500; font-family: var(--font);
    cursor: pointer; transition: background 0.15s, border-color 0.15s;
  }
  .btn-new:hover { background: #35353a; border-color: #3f3f45; }
  .btn-new svg.lucide { width: 15px; height: 15px; }

  .btn-refresh-head {
    width: 36px; height: 36px; border-radius: 9px;
    background: #2a2a2e; color: var(--text-dim);
    border: 1px solid #34343a;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background 0.15s, border-color 0.15s, color 0.15s;
    flex-shrink: 0;
  }
  .btn-refresh-head:hover { background: #35353a; border-color: #3f3f45; color: var(--text); }
  .btn-refresh-head svg.lucide { width: 16px; height: 16px; }
  .btn-refresh-head.spinning svg.lucide { animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    flex-shrink: 0;
    flex-wrap: wrap;
  }

  .filter-tabs {
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--card);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    padding: 4px;
    width: fit-content;
  }
  .filter-tab {
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-dim);
    background: transparent;
    border: none;
    cursor: pointer;
    font-family: var(--font);
    display: inline-flex; align-items: center; gap: 6px;
    transition: background 0.18s, color 0.18s;
    white-space: nowrap;
  }
  .filter-tab svg.lucide { width: 14px; height: 14px; }
  .filter-tab:hover { color: var(--text); }
  .filter-tab.active {
    background: var(--accent);
    color: var(--text);
  }
  .filter-tab .tab-count {
    background: var(--bg-3);
    color: var(--text-dim);
    border-radius: 5px;
    padding: 0 6px;
    font-size: 11px;
    font-weight: 700;
    line-height: 16px;
    min-width: 18px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .filter-tab.active .tab-count {
    background: rgba(255,255,255,0.08);
    color: var(--text);
  }

  .range-nav {
    display: flex; align-items: center; gap: 4px;
    background: var(--card);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    padding: 4px;
    margin-left: auto;
  }
  .range-nav button {
    width: 30px; height: 30px; border-radius: 6px;
    background: transparent; border: none; color: var(--text-dim);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background 0.15s, color 0.15s;
  }
  .range-nav button:hover { background: var(--card-hover); color: var(--text); }
  .range-nav button svg.lucide { width: 15px; height: 15px; }
  .range-nav .range-label {
    padding: 0 12px; font-size: 12.5px; color: var(--text);
    font-weight: 600; white-space: nowrap;
    font-variant-numeric: tabular-nums;
    min-width: 170px;
    text-align: center;
  }
  .range-nav .range-label .rl-sub {
    color: var(--text-faint);
    font-weight: 500;
    font-size: 11.5px;
  }

  .tasks-layout {
    display: flex;
    gap: 16px;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }

  .tasks-panel {
    flex: 1; min-width: 0;
    background: var(--card);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .tasks-scroll {
    flex: 1; min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px 18px 24px;
  }

  .tasks-list { display: flex; flex-direction: column; gap: 26px; }

  .day-section { display: flex; flex-direction: column; }
  .day-head {
    display: flex; align-items: baseline; gap: 10px;
    padding: 0 4px 8px;
    border-bottom: 1px solid var(--border-soft);
    margin-bottom: 8px;
  }
  .day-head .dh-label {
    font-size: 13px; font-weight: 600;
    color: var(--text);
    letter-spacing: -0.01em;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .day-head .dh-label svg.lucide { width: 13px; height: 13px; color: var(--text-dim); }
  .day-head.today .dh-label::after {
    content: '';
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text);
    margin-left: 2px;
    vertical-align: 2px;
  }
  .day-head .dh-count {
    margin-left: auto;
    font-size: 11.5px; color: var(--text-faint);
    font-variant-numeric: tabular-nums;
    font-weight: 500;
  }

  .task-card {
    background: var(--bg-3);
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    overflow: hidden;
    transition: border-color 0.15s, background 0.12s;
    position: relative;
    margin-bottom: 6px;
  }
  .task-card:last-child { margin-bottom: 0; }
  .task-card:hover { border-color: var(--border); }
  .task-card.active { border-color: var(--border); background: var(--card-hover); }
  .task-card.done { opacity: 0.5; }
  .task-card.done .task-name { text-decoration: line-through; text-decoration-color: var(--text-faint); }

  .task-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    background: var(--text-faint);
    opacity: 0.4;
  }
  .task-card.is-assignment::before {
    background: var(--purple);
    opacity: 0.85;
  }
  .task-card.is-unscheduled::before {
    background: var(--yellow);
    opacity: 0.85;
  }
  .task-card.is-activity::before {
    background: var(--blue);
    opacity: 0.85;
  }

  .task-main {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px 12px 16px;
    cursor: pointer;
  }

  .task-check {
    width: 18px; height: 18px;
    border-radius: 5px;
    border: 1.5px solid var(--border);
    background: var(--bg-2);
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    position: relative;
  }
  .task-check:hover { border-color: var(--text-dim); }
  .task-check:active { transform: scale(0.9); }
  .task-check svg.lucide { width: 11px; height: 11px; color: var(--bg); stroke-width: 3; }
  .task-check.checked { background: var(--green); border-color: var(--green); }
  .task-check.loading { background: var(--bg-3); border-color: var(--text-faint); }
  .task-check.loading::after {
    content: ''; width: 8px; height: 8px;
    border: 1.5px solid var(--text-faint);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  .task-activity-icon {
    width: 18px; height: 18px;
    flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--blue);
    opacity: 0.85;
  }
  .task-activity-icon svg.lucide { width: 15px; height: 15px; }

  .task-body { flex: 1; min-width: 0; }
  .task-name {
    font-size: 13.5px; font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.35;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .task-card.done .task-name { font-weight: 500; color: var(--text-dim); }

  .task-meta {
    display: flex; align-items: center; gap: 6px;
    margin-top: 3px;
    font-size: 12px;
    color: var(--text-dim);
    min-width: 0;
  }
  .task-meta .tm-vak {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .task-meta .tm-vak.tm-activity {
    color: var(--blue);
    font-weight: 600;
  }

  .task-actions {
    display: flex; align-items: center; gap: 2px;
    flex-shrink: 0;
  }
  .task-actions button {
    width: 28px; height: 28px; border-radius: 7px;
    background: transparent; border: none; color: var(--text-faint);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background 0.12s, color 0.12s;
  }
  .task-actions button:hover { background: var(--bg-2); color: var(--text); }
  .task-actions button.danger:hover { background: var(--red-soft); color: var(--red); }
  .task-actions button svg.lucide { width: 15px; height: 15px; }

  .detail-panel {
    width: 0;
    flex-shrink: 0;
    background: var(--card);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    opacity: 0;
    transition: width 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.2s ease;
  }
  .detail-panel.open {
    width: 420px;
    opacity: 1;
  }
  .detail-panel-inner {
    display: flex;
    flex-direction: column;
    min-width: 420px;
    height: 100%;
  }

  .detail-head {
    padding: 18px 20px 16px;
    border-bottom: 1px solid var(--border-soft);
    display: flex; align-items: flex-start; gap: 14px;
    flex-shrink: 0;
  }
  .detail-head-inner { flex: 1; min-width: 0; }
  .detail-type {
    font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--text-dim);
    display: inline-flex; align-items: center; gap: 5px;
    margin-bottom: 6px;
  }
  .detail-type svg.lucide { width: 12px; height: 12px; }
  .detail-type.is-assignment { color: var(--purple); }
  .detail-type.is-unscheduled { color: var(--yellow); }
  .detail-type.is-activity { color: var(--blue); }
  .detail-title {
    font-size: 17px; font-weight: 700; letter-spacing: -0.01em;
    line-height: 1.35; word-break: break-word;
  }
  .detail-close {
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--bg-3); color: var(--text-dim);
    border: 1px solid var(--border);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
    transition: background 0.15s, color 0.15s;
  }
  .detail-close:hover { background: var(--card-hover); color: var(--text); }
  .detail-close svg.lucide { width: 16px; height: 16px; }

  .detail-body {
    padding: 18px 20px;
    overflow-y: auto;
    flex: 1;
    font-size: 13.5px; line-height: 1.7;
    min-width: 0;
    -webkit-overflow-scrolling: touch;
  }

  .detail-empty {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100%; color: var(--text-faint); gap: 10px;
    padding: 40px; text-align: center;
  }
  .detail-empty svg.lucide { width: 40px; height: 40px; opacity: 0.4; }
  .detail-empty p { font-size: 13px; }

  .detail-badge-row {
    display: flex; gap: 6px; flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .detail-badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 9px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .detail-badge svg.lucide { width: 12px; height: 12px; }
  .detail-badge.assignment { background: var(--purple-soft); color: var(--purple); }
  .detail-badge.done { background: var(--green-soft); color: var(--green); }
  .detail-badge.unscheduled { background: var(--yellow-soft); color: var(--yellow); }
  .detail-badge.deadline { background: var(--red-soft); color: var(--red); }
  .detail-badge.activity { background: var(--blue-soft); color: var(--blue); }

  .detail-info { color: var(--text); }
  .detail-info p { margin: 0 0 10px; }
  .detail-info p:last-child { margin-bottom: 0; }
  .detail-info a { color: #b8b8bc; }
  .detail-info img { max-width: 100%; height: auto; border-radius: 6px; }
  .detail-info ul, .detail-info ol { margin: 6px 0 10px; padding-left: 24px; }
  .detail-info li { margin: 3px 0; }

  .detail-row {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 0;
    font-size: 13px;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border-soft);
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-row svg.lucide { width: 14px; height: 14px; color: var(--text-faint); flex-shrink: 0; }
  .detail-row strong { color: var(--text); font-weight: 600; }
  .detail-row .dr-label {
    color: var(--text-faint); font-size: 11.5px;
    text-transform: uppercase; letter-spacing: 0.05em;
    min-width: 85px;
  }

  .detail-section {
    margin-top: 16px; padding-top: 14px;
    border-top: 1px solid var(--border-soft);
  }
  .detail-section:first-child { margin-top: 0; padding-top: 0; border-top: none; }
  .detail-section-title {
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-dim);
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 6px;
  }
  .detail-section-title svg.lucide { width: 12px; height: 12px; }

  .detail-attach {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 11px; background: var(--bg-3);
    border: 1px solid var(--border); border-radius: 7px;
    font-size: 12.5px; margin: 0 6px 6px 0;
    color: var(--text);
  }
  .detail-attach svg.lucide { width: 13px; height: 13px; color: var(--text-dim); }

  .detail-link {
    display: flex; align-items: center; gap: 6px;
    color: #b8b8bc; font-size: 12.5px;
    padding: 5px 0;
    text-decoration: none;
    word-break: break-all;
  }
  .detail-link svg.lucide { width: 12px; height: 12px; flex-shrink: 0; }
  .detail-link:hover { text-decoration: underline; }

  .detail-foot {
    padding: 12px 20px;
    border-top: 1px solid var(--border-soft);
    display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end;
    flex-shrink: 0;
  }
  .detail-foot:empty { display: none; }
  .action-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px 12px; background: var(--bg-3); color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 12.5px; font-family: var(--font); font-weight: 500;
    cursor: pointer; transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .action-btn svg.lucide { width: 15px; height: 15px; }
  .action-btn:hover { background: var(--card-hover); color: var(--text); }
  .action-btn.primary { background: #2a2a2e; border-color: #34343a; color: var(--text); }
  .action-btn.primary:hover { background: #35353a; border-color: #3f3f45; }
  .action-btn.success:hover { background: var(--green-soft); color: var(--green); border-color: transparent; }
  .action-btn.danger:hover { background: var(--red-soft); color: var(--red); border-color: transparent; }
  .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; color: var(--text-faint); gap: 10px; padding: 60px 20px; text-align: center;
  }
  .empty svg.lucide { width: 40px; height: 40px; opacity: 0.4; }
  .empty p { font-size: 13px; }

  .skeleton-row {
    height: 58px; border-radius: 10px;
    background: linear-gradient(90deg,
      rgba(255,255,255,0.03) 0%,
      rgba(255,255,255,0.07) 50%,
      rgba(255,255,255,0.03) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.4s ease-in-out infinite;
    margin-bottom: 6px;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .new-task-bg {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
  }
  .new-task-bg.show { opacity: 1; pointer-events: auto; }
  .new-task-panel {
    width: 100%; max-width: 460px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    display: flex; flex-direction: column;
    max-height: calc(100dvh - 40px);
    overflow: hidden;
    transform: translateY(12px);
    transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .new-task-bg.show .new-task-panel { transform: translateY(0); }
  .new-task-head {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border-soft);
    display: flex; align-items: center; justify-content: space-between;
  }
  .new-task-head h3 {
    font-size: 15px; font-weight: 700;
    display: flex; align-items: center; gap: 8px;
  }
  .new-task-head h3 svg.lucide { width: 16px; height: 16px; color: var(--text-dim); }
  .new-task-head .close-btn {
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--bg-3); color: var(--text-dim);
    border: 1px solid var(--border);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .new-task-head .close-btn:hover { background: var(--card-hover); color: var(--text); }
  .new-task-head .close-btn svg.lucide { width: 16px; height: 16px; }
  .new-task-body {
    padding: 18px 20px;
    overflow-y: auto;
    flex: 1;
  }
  .new-task-foot {
    padding: 14px 20px;
    border-top: 1px solid var(--border-soft);
    display: flex; gap: 8px; justify-content: flex-end;
  }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-dim); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
  .field input, .field textarea, .field select {
    width: 100%; padding: 11px 14px;
    background: var(--bg-2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); color: var(--text);
    font-size: 14px; font-family: var(--font);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .field textarea { resize: vertical; min-height: 70px; }
  .field select { cursor: pointer; }
  .field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: #444; box-shadow: 0 0 0 3px rgba(255,255,255,0.04); }
  .field input::placeholder, .field textarea::placeholder { color: var(--text-faint); }

  .color-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .color-swatch {
    width: 28px; height: 28px;
    border-radius: 8px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.1s;
  }
  .color-swatch:hover { transform: scale(1.08); }
  .color-swatch.active { border-color: var(--text); }

  .date-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .date-chip {
    padding: 6px 11px;
    border-radius: 7px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 12.5px;
    font-weight: 500;
    font-family: var(--font);
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .date-chip:hover { background: var(--bg-3); color: var(--text); }
  .date-chip.active { background: var(--accent); color: var(--text); border-color: #3a3a40; }

  .toast-wrap {
    position: fixed; bottom: 20px; right: 20px; z-index: 200;
    display: flex; flex-direction: column; gap: 8px;
    max-width: calc(100vw - 40px);
  }
  .toast {
    padding: 12px 16px; background: var(--bg-3);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    font-size: 13px; box-shadow: var(--shadow);
    animation: slideUp 0.25s ease; max-width: 320px;
    display: flex; align-items: center; gap: 8px;
  }
  .toast svg.lucide { width: 15px; height: 15px; flex-shrink: 0; }
  .toast.error { border-color: var(--red); color: var(--red); }
  .toast.success { border-color: var(--green); color: var(--green); }

  @media (max-width: 820px) {
    .content { padding: 14px; }
    .page-head { flex-direction: column; align-items: stretch; gap: 10px; }
    .page-head-actions { justify-content: space-between; }
    .page-head h2 { font-size: 19px; }
    .btn-new span { display: none; }
    .btn-new { padding: 9px 11px; }
    .toolbar { gap: 8px; }
    .range-nav { margin-left: 0; flex: 1; }
    .range-nav .range-label { min-width: 0; flex: 1; }
    .tasks-scroll { padding: 12px 12px 20px; }

    .detail-panel {
      position: fixed;
      inset: 0;
      z-index: 60;
      width: auto;
      max-width: none;
      border-radius: 0;
      border: none;
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.2s ease;
      opacity: 0;
      pointer-events: none;
    }
    .detail-panel.open {
      width: auto;
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }
    .detail-panel-inner { min-width: 0; width: 100%; }
    .detail-head { padding-top: calc(18px + env(safe-area-inset-top, 0px)); }
    .detail-foot { padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
    .detail-body { padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }

    .new-task-bg { padding: 0; }
    .new-task-panel { max-width: 100vw; max-height: 100dvh; height: 100dvh; border-radius: 0; border: none; }
    .new-task-head { padding-top: calc(16px + env(safe-area-inset-top, 0px)); }
    .new-task-foot { padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
  }
</style>
</head>
<body>

<div id="app">
  <div class="main">
    <main class="content">

</div>

<div class="new-task-bg" id="new-task-bg">

      <h3><i data-lucide="plus"></i> Nieuwe taak</h3>

<div class="toast-wrap" id="toasts"></div>

<script>
'use strict';

const API_BASE = 'https://smartschoolbridge.onrender.com';
const PLANNER_BASE = API_BASE + '/api/planner';

const $  = id => document.getElementById(id);
const $$ = (sel, root) => (root || document).querySelectorAll(sel);

const ESC_MAP = { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' };
const ESC_RE  = /[&<>"']/g;
const esc = s => {
  if (s == null) return '';
  const str = typeof s === 'string' ? s : String(s);
  ESC_RE.lastIndex = 0;
  if (!ESC_RE.test(str)) return str;
  ESC_RE.lastIndex = 0;
  return str.replace(ESC_RE, c => ESC_MAP[c]);
};

const NL_MONTHS = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const NL_DAYS   = ['zo','ma','di','wo','do','vr','za'];

function icon(name) { return `<i data-lucide="${name}"></i>`; }
function refreshIcons() {
  if (window.lucide && typeof window.lucide.createIcons === 'function') {
    window.lucide.createIcons();
  }
}

const toastWrap = $('toasts');
function toast(msg, type = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const ic = type === 'error' ? 'alert-circle' : type === 'success' ? 'check-circle' : 'info';
  el.innerHTML = icon(ic) + '<span>' + esc(msg) + '</span>';
  toastWrap.appendChild(el);
  refreshIcons();
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3500);
}

const isMobile = () => window.matchMedia('(max-width: 820px)').matches;

const auth = {
  creds: null, user: null,
  encodeCreds() {
    if (!this.creds) return null;
    return btoa(unescape(encodeURIComponent(JSON.stringify(this.creds))));
  },
  setCreds(c) { this.creds = c; try { localStorage.setItem('ss_creds', JSON.stringify(c)); } catch {} },
  tryRestore() {
    try {
      const raw = localStorage.getItem('ss_creds');
      if (!raw) return false;
      this.creds = JSON.parse(raw);
      return true;
    } catch { return false; }
  },
  clear() {
    this.creds = null; this.user = null;
    try { localStorage.removeItem('ss_creds'); } catch {}
    rangeCache.clear();
  },
};

async function apiFetch(path, opts = {}) {
  const headers = Object.assign({}, opts.headers || {});
  const credsHeader = auth.encodeCreds();
  if (credsHeader) headers['X-SS-Creds'] = credsHeader;

  const url = path.startsWith('http') ? path : API_BASE + path;
  const res = await fetch(url, Object.assign({}, opts, { headers }));

  if (!res.ok) {
    let msg = `HTTP ${res.status}`;
    try {
      const data = await res.json();
      if (data.error) msg = data.error;
    } catch {}
    throw new Error(msg);
  }
  if (res.status === 204) return null;
  const ct = res.headers.get('Content-Type') || '';
  if (ct.includes('application/json')) return res.json();
  return res.text();
}

function withQuery(path, params) {
  const qs = [];
  for (const [k, v] of Object.entries(params || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (v === true) qs.push(`${k}=1`);
    else qs.push(`${k}=${encodeURIComponent(v)}`);
  }
  if (!qs.length) return path;
  return path + (path.includes('?') ? '&' : '?') + qs.join('&');
}

const CACHE_TTL = 2 * 60 * 1000;
const rangeCache = {
  _map: new Map(),
  get(key) {
    const e = this._map.get(key);
    if (!e) return null;
    if (Date.now() - e.ts > CACHE_TTL) { this._map.delete(key); return null; }
    return e.data;
  },
  set(key, data) { this._map.set(key, { data, ts: Date.now() }); },
  clear() { this._map.clear(); },
};

const api = {
  auth: {
    async login() {
      const data = await apiFetch('/api/auth/login', { method: 'POST' });
      auth.user = { username: data.username, main_url: data.main_url };
      return auth.user;
    },
  },
  tasks: {
    async loadRange(fromDate, toDate, force = false) {
      const key = 'range:' + fromDate + ':' + toDate;
      if (!force) {
        const c = rangeCache.get(key);
        if (c) return c;
      }
      const fromIso = fromDate + 'T00:00:00+02:00';
      const toIso = toDate + 'T23:59:59+02:00';
      const data = await apiFetch(withQuery(PLANNER_BASE, {
        from: fromIso,
        to: toIso,
        types: 'tasks',
        compact: 1,
        hours: 0,
        limit: 500,
      }));
      rangeCache.set(key, data);
      return data;
    },
    async detail(id, type) {
      const key = 'item:' + type + ':' + id;
      const c = rangeCache.get(key);
      if (c) return c;
      const data = await apiFetch(withQuery(
        PLANNER_BASE + '/item/' + encodeURIComponent(id),
        { type }
      ));
      rangeCache.set(key, data);
      return data;
    },
    async action(platformId, elementId, action, type) {
      const data = await apiFetch(withQuery(
        PLANNER_BASE + '/' + encodeURIComponent(platformId) + '/' +
          encodeURIComponent(elementId) + '/' + encodeURIComponent(action),
        { type }
      ), { method: 'POST' });
      rangeCache.clear();
      return data;
    },
    async create({ name, description, date_from, color, whole_day }) {
      const data = await apiFetch(PLANNER_BASE + '/todo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name, description,
          date_from,
          color: color || 'green-200',
          whole_day: whole_day !== false,
        }),
      });
      rangeCache.clear();
      return data;
    },
  },
};

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}
function addDays(dateStr, n) {
  const p = dateStr.split('-').map(Number);
  const d = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
  d.setUTCDate(d.getUTCDate() + n);
  return d.getUTCFullYear() + '-' +
    String(d.getUTCMonth() + 1).padStart(2, '0') + '-' +
    String(d.getUTCDate()).padStart(2, '0');
}
function mondayOf(dateStr) {
  const p = dateStr.split('-').map(Number);
  const d = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
  const dow = (d.getUTCDay() + 6) % 7;
  return addDays(dateStr, -dow);
}
function dateStrFromMs(ms) {
  if (!ms) return '';
  const d = new Date(ms);
  return d.getUTCFullYear() + '-' +
    String(d.getUTCMonth() + 1).padStart(2, '0') + '-' +
    String(d.getUTCDate()).padStart(2, '0');
}
function fmtDayHeader(dateStr) {
  const today = todayStr();
  const tomorrow = addDays(today, 1);
  if (dateStr === today) return 'Vandaag';
  if (dateStr === tomorrow) return 'Morgen';
  const p = dateStr.split('-').map(Number);
  const d = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
  const dag = NL_DAYS[d.getUTCDay()];
  return dag.charAt(0).toUpperCase() + dag.slice(1) + ' ' + d.getUTCDate() + ' ' + NL_MONTHS[d.getUTCMonth()];
}
function fmtRangeLabel(fromDate, toDate) {
  const f = fromDate.split('-').map(Number);
  const t = toDate.split('-').map(Number);
  const fd = new Date(Date.UTC(f[0], f[1] - 1, f[2]));
  const td = new Date(Date.UTC(t[0], t[1] - 1, t[2]));
  const fMonth = NL_MONTHS[fd.getUTCMonth()];
  const tMonth = NL_MONTHS[td.getUTCMonth()];
  if (f[1] === t[1]) return fd.getUTCDate() + ' – ' + td.getUTCDate() + ' ' + tMonth;
  return fd.getUTCDate() + ' ' + fMonth + ' – ' + td.getUTCDate() + ' ' + tMonth;
}
function isToday(dateStr) { return dateStr === todayStr(); }

let currentFilter = 'open';
let rangeStart = null;
let allItems = [];
let platformId = '';
let currentRangeContainsToday = false;
let currentDetailId = null;

function isDone(item) { return item.st === 'resolved'; }
function isAssignment(item) { return item.t === 'planned-assignments'; }
function isActivity(item) { return item.t === 'planned-school-activities'; }
function isOwnTodo(item) { return item.t === 'planned-to-dos'; }
function hasNoDeadline(item) { return !item.df; }
function isActionable(item) { return isOwnTodo(item) || isAssignment(item); }

function computeRange(fromDate) {
  return { from: fromDate, to: addDays(fromDate, 13) };
}

function render() {
  const list = $('tasks-list');
  if (!rangeStart) return;

  const filtered = allItems.filter(x =>
    currentFilter === 'open' ? !isDone(x) : isDone(x)
  );

  updateCounts();

  if (!filtered.length) {
    const msg = currentFilter === 'done' ? 'Niets afgerond in deze periode' : 'Geen open taken in deze periode';
    const ic = currentFilter === 'done' ? 'check-circle' : 'check-square';
    list.innerHTML = '<div class="empty">' + icon(ic) + '<p>' + msg + '</p></div>';
    refreshIcons();
    return;
  }

  const noDeadline = [];
  const byDay = new Map();

  for (const it of filtered) {
    if (hasNoDeadline(it)) {
      noDeadline.push(it);
    } else {
      const ds = dateStrFromMs(it.df);
      if (!byDay.has(ds)) byDay.set(ds, []);
      byDay.get(ds).push(it);
    }
  }

  const sortFn = (a, b) => {
    const rank = x => isAssignment(x) ? 0 : isActivity(x) ? 1 : 2;
    const ar = rank(a), br = rank(b);
    if (ar !== br) return ar - br;
    if ((a.dl || 0) !== (b.dl || 0)) return (b.dl || 0) - (a.dl || 0);
    return (a.n || '').localeCompare(b.n || '');
  };

  const sections = [];

  if (currentRangeContainsToday && noDeadline.length) {
    noDeadline.sort(sortFn);
    sections.push(
      '<div class="day-section">' +
        '<div class="day-head">' +
          '<span class="dh-label">' + icon('pin') + 'Geen deadline</span>' +
          '<span class="dh-count">' + noDeadline.length + '</span>' +
        '</div>' +
        noDeadline.map(renderTaskCard).join('') +
      '</div>'
    );
  }

  const sortedDays = Array.from(byDay.entries()).sort((a, b) => a[0].localeCompare(b[0]));
  const today = todayStr();

  for (const [dateKey, items] of sortedDays) {
    if (currentRangeContainsToday && currentFilter === 'open' && dateKey < today) {
      continue;
    }
    items.sort(sortFn);
    const todayCls = isToday(dateKey) ? ' today' : '';
    sections.push(
      '<div class="day-section">' +
        '<div class="day-head' + todayCls + '">' +
          '<span class="dh-label">' + esc(fmtDayHeader(dateKey)) + '</span>' +
          '<span class="dh-count">' + items.length + '</span>' +
        '</div>' +
        items.map(renderTaskCard).join('') +
      '</div>'
    );
  }

  if (!sections.length) {
    const msg = currentFilter === 'done' ? 'Niets afgerond in deze periode' : 'Geen open taken in deze periode';
    const ic = currentFilter === 'done' ? 'check-circle' : 'check-square';
    list.innerHTML = '<div class="empty">' + icon(ic) + '<p>' + msg + '</p></div>';
    refreshIcons();
    return;
  }

  list.innerHTML = sections.join('');
  refreshIcons();
  attachHandlers();
}

function renderTaskCard(item) {
  const done = isDone(item);
  const assignment = isAssignment(item);
  const activity = isActivity(item);
  const noDl = hasNoDeadline(item);
  const active = currentDetailId && currentDetailId === item.i;

  let metaLabel = '';
  if (item.c) metaLabel = esc(item.c);
  else if (assignment) metaLabel = 'Opdracht';
  else if (activity) metaLabel = 'Schoolactiviteit';

  const metaHtml = metaLabel
    ? '<div class="task-meta"><span class="tm-vak' + (activity ? ' tm-activity' : '') + '">' + metaLabel + '</span></div>'
    : '';

  let cls = 'task-card';
  if (done) cls += ' done';
  if (assignment) cls += ' is-assignment';
  else if (activity) cls += ' is-activity';
  else if (noDl) cls += ' is-unscheduled';
  if (active) cls += ' active';

  const leadHtml = activity
    ? '<div class="task-activity-icon" title="Schoolactiviteit">' + icon('sparkles') + '</div>'
    : '<div class="task-check' + (done ? ' checked' : '') + '" data-role="check" title="' + (done ? 'Heropenen' : 'Afronden') + '">' +
        (done ? icon('check') : '') +
      '</div>';

  const actionsHtml = (assignment || activity)
    ? ''
    : '<div class="task-actions">' +
        '<button class="danger" data-role="trash" title="Verwijderen">' + icon('trash-2') + '</button>' +
      '</div>';

  return (
    '<div class="' + cls + '" data-id="' + esc(item.i) + '" data-type="' + esc(item.t) + '">' +
      '<div class="task-main">' +
        leadHtml +
        '<div class="task-body">' +
          '<div class="task-name">' + esc(item.n || '(geen naam)') + '</div>' +
          metaHtml +
        '</div>' +
        actionsHtml +
      '</div>' +
    '</div>'
  );
}

function updateCounts() {
  const open = allItems.filter(x => !isDone(x)).length;
  const done = allItems.filter(x => isDone(x)).length;
  $('count-open').textContent = open;
  $('count-done').textContent = done;

  const total = allItems.length;
  const sub = $('tasks-subtitle');
  if (total === 0) sub.textContent = 'Je opdrachten en eigen taken';
  else sub.textContent = open + ' open · ' + done + ' afgerond';
}

function attachHandlers() {
  $$('#tasks-list .task-card').forEach(card => {
    const id = card.dataset.id;
    const type = card.dataset.type;

    card.querySelector('[data-role="check"]')?.addEventListener('click', async (e) => {
      e.stopPropagation();
      await toggleDone(card, id, type);
    });

    card.querySelector('[data-role="trash"]')?.addEventListener('click', async (e) => {
      e.stopPropagation();
      await trashTask(card, id, type);
    });

    card.querySelector('.task-main')?.addEventListener('click', (e) => {
      if (e.target.closest('[data-role]')) return;
      openDetail(id, type);
    });
  });
}

async function toggleDone(card, id, type) {
  const checkEl = card.querySelector('[data-role="check"]');
  const done = card.classList.contains('done');
  const action = done ? 'unresolve' : 'resolve';

  checkEl.classList.add('loading');
  checkEl.innerHTML = '';

  try {
    await api.tasks.action(platformId, id, action, type);
    const item = allItems.find(x => x.i === id);
    if (item) item.st = done ? '' : 'resolved';
    toast(done ? 'Heropend' : 'Afgerond', 'success');
    render();
    if (currentDetailId === id) {
      const updated = allItems.find(x => x.i === id);
      if (updated) renderDetailHeader(updated);
    }
  } catch (e) {
    checkEl.classList.remove('loading');
    checkEl.innerHTML = done ? icon('check') : '';
    refreshIcons();
    toast(e.message, 'error');
  }
}

async function trashTask(card, id, type) {
  if (!confirm('Taak verwijderen?')) return;
  try {
    await api.tasks.action(platformId, id, 'trash', type);
    allItems = allItems.filter(x => x.i !== id);
    if (currentDetailId === id) closeDetail();
    toast('Verwijderd', 'success');
    render();
  } catch (e) {
    toast(e.message, 'error');
  }
}

function renderDetailHeader(item) {
  const typeEl = $('detail-type');
  typeEl.className = 'detail-type';

  let typeLabel = 'Eigen taak';
  let typeIcon = 'check-square';

  if (isAssignment(item)) {
    typeEl.classList.add('is-assignment');
    typeLabel = 'Opdracht';
    typeIcon = 'file-text';
  } else if (isActivity(item)) {
    typeEl.classList.add('is-activity');
    typeLabel = 'Schoolactiviteit';
    typeIcon = 'sparkles';
  } else if (hasNoDeadline(item)) {
    typeEl.classList.add('is-unscheduled');
    typeLabel = 'Geen deadline';
    typeIcon = 'pin';
  }

  typeEl.innerHTML = icon(typeIcon) + typeLabel;
  $('detail-title').textContent = item.n || '(geen naam)';
}

function renderDetailBody(base, detail, errorMsg) {
  if (!base) {
    $('detail-body').innerHTML =
      '<div class="detail-empty"><p style="color:var(--red)">' +
      esc(errorMsg || 'Taak niet gevonden') + '</p></div>';
    return;
  }

  const done = isDone(base);
  const assignment = isAssignment(base);
  const activity = isActivity(base);
  const noDl = hasNoDeadline(base);

  const badges = [];
  if (done) badges.push('<span class="detail-badge done">' + icon('check') + 'Afgerond</span>');
  if (assignment) badges.push('<span class="detail-badge assignment">' + icon('file-text') + 'Opdracht</span>');
  if (activity) badges.push('<span class="detail-badge activity">' + icon('sparkles') + 'Schoolactiviteit</span>');
  if (noDl && !activity) badges.push('<span class="detail-badge unscheduled">' + icon('pin') + 'Geen deadline</span>');

  let bodyHtml = '';
  if (badges.length) {
    bodyHtml += '<div class="detail-badge-row">' + badges.join('') + '</div>';
  }

  const rows = [];
  if (base.c) rows.push(row('book-open', 'Vak', base.c));
  if (base.te) rows.push(row('user', 'Leerkracht', base.te));
  if (base.l) rows.push(row('map-pin', 'Lokaal', base.l));
  const ds = dateStrFromMs(base.df);
  if (ds) {
    const p = ds.split('-').map(Number);
    const d = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
    const label = d.getUTCDate() + ' ' + NL_MONTHS[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
    rows.push(row('calendar', 'Datum', label));
  }
  if (rows.length) {
    bodyHtml += '<div class="detail-section" style="margin-top:0;padding-top:0;border-top:none">' + rows.join('') + '</div>';
  }

  if (detail?.public_info) {
    bodyHtml += '<div class="detail-section">' +
      '<div class="detail-section-title">' + icon('align-left') + 'Beschrijving</div>' +
      '<div class="detail-info">' + detail.public_info + '</div>' +
    '</div>';
  }

  if (detail?.attachments?.length) {
    const chips = detail.attachments.map(a =>
      '<span class="detail-attach">' + icon('paperclip') + esc(a.name || 'bestand') + '</span>'
    ).join('');
    bodyHtml += '<div class="detail-section">' +
      '<div class="detail-section-title">' + icon('paperclip') + 'Bijlagen</div>' +
      chips +
    '</div>';
  }

  if (detail?.weblinks?.length) {
    const links = detail.weblinks.map(u =>
      '<a class="detail-link" href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' +
        icon('external-link') + esc(u) +
      '</a>'
    ).join('');
    bodyHtml += '<div class="detail-section">' +
      '<div class="detail-section-title">' + icon('link') + 'Links</div>' +
      links +
    '</div>';
  }

  if (errorMsg && !detail) {
    bodyHtml += '<div class="detail-section" style="color:var(--text-dim);font-size:12.5px">' +
      esc(errorMsg) + '</div>';
  }

  $('detail-body').innerHTML = bodyHtml;
  refreshIcons();
}

function renderDetailFoot(base) {
  const foot = [];

  if (!isActionable(base)) {
    $('detail-foot').innerHTML = '';
    return;
  }

  const done = isDone(base);
  const assignment = isAssignment(base);

  if (done) {
    foot.push('<button class="action-btn" data-act="unresolve">' + icon('rotate-ccw') + ' Heropenen</button>');
  } else {
    foot.push('<button class="action-btn success" data-act="resolve">' + icon('check') + ' Afronden</button>');
  }

  if (!assignment) {
    foot.push('<button class="action-btn danger" data-act="trash">' + icon('trash-2') + ' Verwijderen</button>');
  }

  $('detail-foot').innerHTML = foot.join('');
  refreshIcons();

  $$('#detail-foot [data-act]').forEach(btn => {
    btn.addEventListener('click', () => handleDetailAction(btn.dataset.act));
  });
}

async function handleDetailAction(action) {
  if (!currentDetailId) return;
  const item = allItems.find(x => x.i === currentDetailId);
  if (!item) return;
  if (!isActionable(item)) return;

  if (action === 'trash') {
    if (!confirm('Taak verwijderen?')) return;
    try {
      await api.tasks.action(platformId, item.i, 'trash', item.t);
      allItems = allItems.filter(x => x.i !== currentDetailId);
      closeDetail();
      toast('Verwijderd', 'success');
      render();
    } catch (e) {
      toast(e.message, 'error');
    }
    return;
  }

  const done = action === 'unresolve';
  try {
    await api.tasks.action(platformId, item.i, action, item.t);
    item.st = done ? '' : 'resolved';
    toast(done ? 'Heropend' : 'Afgerond', 'success');
    render();
    const updated = allItems.find(x => x.i === currentDetailId);
    if (updated) {
      renderDetailHeader(updated);
      renderDetailFoot(updated);
      const cachedDetail = rangeCache.get('item:' + item.t + ':' + item.i);
      renderDetailBody(updated, cachedDetail);
    }
  } catch (e) {
    toast(e.message, 'error');
  }
}

async function openDetail(id, type) {
  if (currentDetailId === id && $('detail-panel').classList.contains('open')) {
    closeDetail();
    return;
  }

  currentDetailId = id;
  const item = allItems.find(x => x.i === id);
  if (!item) return;

  $$('#tasks-list .task-card').forEach(c => {
    c.classList.toggle('active', c.dataset.id === id);
  });

  $('detail-panel').classList.add('open');
  if (isMobile()) document.body.classList.add('overlay-open');

  renderDetailHeader(item);

  $('detail-body').innerHTML =
    '<div class="detail-empty">' + icon('loader') + '</div>';
  $('detail-foot').innerHTML = '';
  refreshIcons();

  renderDetailFoot(item);

  try {
    const detail = await api.tasks.detail(id, type);
    renderDetailBody(item, detail);
  } catch (e) {
    renderDetailBody(item, null, e.message);
  }
}

function closeDetail() {
  currentDetailId = null;
  $('detail-panel').classList.remove('open');
  document.body.classList.remove('overlay-open');
  $$('#tasks-list .task-card').forEach(c => c.classList.remove('active'));
  setTimeout(() => {
    if (!$('detail-panel').classList.contains('open')) {
      $('detail-body').innerHTML =
        '<div class="detail-empty">' +
          '<i data-lucide="check-square"></i>' +
          '<p>Selecteer een taak</p>' +
        '</div>';
      $('detail-type').innerHTML = '';
      $('detail-title').textContent = '';
      $('detail-foot').innerHTML = '';
      refreshIcons();
    }
  }, 300);
}

function row(iconName, label, value) {
  return '<div class="detail-row">' + icon(iconName) +
    '<span class="dr-label">' + esc(label) + '</span>' +
    '<strong>' + esc(value) + '</strong></div>';
}

function updateRangeLabel() {
  if (!rangeStart) return;
  const { to } = computeRange(rangeStart);
  const label = fmtRangeLabel(rangeStart, to);
  const isCurrent = currentRangeContainsToday;
  $('range-label').innerHTML = isCurrent
    ? '<span class="rl-sub">Huidige</span> · ' + esc(label)
    : esc(label);
}

async function loadRange(force = false) {
  const { from, to } = computeRange(rangeStart);
  const today = todayStr();
  currentRangeContainsToday = from <= today && today <= to;
  updateRangeLabel();

  try {
    const data = await api.tasks.loadRange(from, to, force);
    allItems = data.items || [];
    const uid = (data.meta && data.meta.user_id) || '';
    platformId = uid.split('_')[0] || platformId;
    render();
  } catch (e) {
    toast('Taken: ' + e.message, 'error');
    $('tasks-list').innerHTML =
      '<div class="empty">' + icon('alert-circle') + '<p>' + esc(e.message) + '</p></div>';
    refreshIcons();
  }
}

function gotoRange(newStart) {
  rangeStart = newStart;
  closeDetail();
  loadRange(false);
  $('tasks-scroll').scrollTop = 0;
}

function setupRangeNav() {
  rangeStart = mondayOf(todayStr());
  $('btn-prev-range').addEventListener('click', () => {
    gotoRange(addDays(rangeStart, -14));
  });
  $('btn-next-range').addEventListener('click', () => {
    gotoRange(addDays(rangeStart, 14));
  });
}

const newTaskState = { date: 'today', color: 'green-200' };

function renderDateChips() {
  const rowEl = $('nt-date-row');
  const options = [
    { key: 'today', label: 'Vandaag' },
    { key: 'tomorrow', label: 'Morgen' },
    { key: 'week', label: 'Volgende week' },
    { key: 'none', label: 'Geen datum' },
  ];
  rowEl.innerHTML = options.map(o =>
    '<button class="date-chip' + (newTaskState.date === o.key ? ' active' : '') + '" data-key="' + o.key + '">' + o.label + '</button>'
  ).join('');
  rowEl.querySelectorAll('.date-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      newTaskState.date = btn.dataset.key;
      renderDateChips();
    });
  });
}

function setupNewTask() {
  renderDateChips();
  $('nt-color-row').querySelectorAll('.color-swatch').forEach(sw => {
    sw.addEventListener('click', () => {
      newTaskState.color = sw.dataset.color;
      $('nt-color-row').querySelectorAll('.color-swatch').forEach(s => {
        s.classList.toggle('active', s === sw);
      });
    });
  });

  $('btn-new-task').addEventListener('click', openNewTask);
  $('new-task-close').addEventListener('click', closeNewTask);
  $('nt-cancel').addEventListener('click', closeNewTask);
  $('new-task-bg').addEventListener('click', (e) => {
    if (e.target === $('new-task-bg')) closeNewTask();
  });
  $('nt-save').addEventListener('click', saveNewTask);
}

function openNewTask() {
  $('nt-name').value = '';
  $('nt-desc').value = '';
  newTaskState.date = 'today';
  newTaskState.color = 'green-200';
  renderDateChips();
  $('nt-color-row').querySelectorAll('.color-swatch').forEach(s => {
    s.classList.toggle('active', s.dataset.color === newTaskState.color);
  });
  $('new-task-bg').classList.add('show');
  document.body.classList.add('overlay-open');
  refreshIcons();
  setTimeout(() => $('nt-name').focus(), 100);
}

function closeNewTask() {
  $('new-task-bg').classList.remove('show');
  if (!isMobile() || !$('detail-panel').classList.contains('open')) {
    document.body.classList.remove('overlay-open');
  }
}

async function saveNewTask() {
  const name = $('nt-name').value.trim();
  if (!name) { toast('Naam is verplicht', 'error'); return; }

  const btn = $('nt-save');
  btn.disabled = true;

  let dateFrom = null;
  const today = todayStr();
  if (newTaskState.date === 'today') dateFrom = today;
  else if (newTaskState.date === 'tomorrow') dateFrom = addDays(today, 1);
  else if (newTaskState.date === 'week') dateFrom = addDays(today, 7);

  try {
    await api.tasks.create({
      name,
      description: $('nt-desc').value.trim(),
      date_from: dateFrom,
      color: newTaskState.color,
      whole_day: true,
    });
    toast('Taak toegevoegd', 'success');
    closeNewTask();
    loadRange(true);
  } catch (e) {
    toast('Toevoegen mislukt: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
  }
}

function setupFilters() {
  $$('#filter-tabs .filter-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      $$('#filter-tabs .filter-tab').forEach(t => t.classList.toggle('active', t === tab));
      currentFilter = tab.dataset.filter;
      closeDetail();
      render();
    });
  });
}

/* ============================================================
   INIT — geen login-formulier, geen delay
   ============================================================ */
autoLogin();
refreshIcons();

async function autoLogin() {
  if (!auth.tryRestore()) {
    showNotLoggedIn();
    return;
  }
  try {
    await apiFetch('/api/auth/login', { method: 'POST' });
    auth.user = { username: auth.creds.username, main_url: auth.creds.main_url };
    onReady();
  } catch (e) {
    auth.clear();
    showNotLoggedIn();
  }
}

function showNotLoggedIn() {
  const msg = 'Niet ingelogd, gelieve in te loggen';
  $('tasks-list').innerHTML =
    '<div class="empty">' +
      icon('log-in') +
      '<p>' + esc(msg) + '</p>' +
    '</div>';
  refreshIcons();
}

function onReady() {
  setupAppEvents();
  setupRangeNav();
  setupFilters();
  setupNewTask();
  loadRange(false);
}

let _eventsBound = false;
function setupAppEvents() {
  if (_eventsBound) return;
  _eventsBound = true;

  $('btn-refresh-tasks').addEventListener('click', async () => {
    const btn = $('btn-refresh-tasks');
    btn.classList.add('spinning');
    rangeCache.clear();
    try { await loadRange(true); }
    finally { setTimeout(() => btn.classList.remove('spinning'), 300); }
  });

  $('detail-close').addEventListener('click', closeDetail);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if ($('new-task-bg').classList.contains('show')) { closeNewTask(); return; }
      if ($('detail-panel').classList.contains('open')) { closeDetail(); return; }
    }
    if ($('new-task-bg').classList.contains('show')) return;
    if ($('detail-panel').classList.contains('open') && isMobile()) return;
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (!rangeStart) return;
    if (e.key === 'ArrowLeft') gotoRange(addDays(rangeStart, -14));
    if (e.key === 'ArrowRight') gotoRange(addDays(rangeStart, 14));
  });

  window.addEventListener('resize', () => {
    if (!isMobile() && $('detail-panel').classList.contains('open')) {
      document.body.classList.remove('overlay-open');
    }
  });
}
</script>

<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Smartschool</title>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root {
    --bg:         #0d0d0f;
    --bg-2:       #121214;
    --bg-3:       #1a1a1d;
    --card:       #141416;
    --card-hover: #1c1c1f;
    --border:     #262629;
    --border-soft:#1d1d20;
    --text:       #e4e4e6;
    --text-dim:   #8a8a8e;
    --text-faint: #5a5a5e;
    --accent:     #2e2e33;
    --green:      #4ade80;
    --red:        #f87171;
    --blue:       #60a5fa;

    --topbar-h: 48px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; width: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }

  svg.lucide { width: 16px; height: 16px; stroke-width: 2; }

  /* ============================================================
     TOP BAR
     ============================================================ */
  .topbar {
    height: calc(var(--topbar-h) + env(safe-area-inset-top, 0px));
    padding-top: env(safe-area-inset-top, 0px);
    background: var(--card);
    border-bottom: 1px solid var(--border-soft);
    display: flex;
    align-items: center;
    gap: 4px;
    padding-left: 12px;
    padding-right: 10px;
    flex-shrink: 0;
    z-index: 100;
    position: relative;
  }

  /* Logo */
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 4px 8px 4px 0;
    margin-right: 6px;
    flex-shrink: 0;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .brand .mark {
    width: 26px;
    height: 26px;
    border-radius: 7px;
    background: linear-gradient(135deg, #2a2a2e, #1f1f23);
    border: 1px solid var(--border);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--blue);
  }
  .brand .mark svg.lucide { width: 15px; height: 15px; }
  .brand .name {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.01em;
    white-space: nowrap;
  }

  /* Nav tabs */
  .nav {
    display: flex;
    align-items: center;
    gap: 2px;
    flex: 1;
    min-width: 0;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
  }
  .nav::-webkit-scrollbar { display: none; }

  .tab {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 12px;
    border-radius: 8px;
    background: transparent;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 500;
    white-space: nowrap;
    transition: background 0.12s, color 0.12s;
    -webkit-tap-highlight-color: transparent;
    flex-shrink: 0;
    position: relative;
  }
  .tab:hover { background: var(--bg-3); color: var(--text); }
  .tab.active {
    background: var(--accent);
    color: var(--text);
  }
  .tab .ico {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .tab .ico svg.lucide { width: 16px; height: 16px; }
  .tab .lbl { white-space: nowrap; }

  /* Rechterkant (afmelden + status) */
  .topbar-right {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
    margin-left: 6px;
    padding-left: 10px;
    border-left: 1px solid var(--border-soft);
  }

  .logout-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 12px;
    border-radius: 8px;
    background: transparent;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 500;
    transition: background 0.12s, color 0.12s;
    -webkit-tap-highlight-color: transparent;
    flex-shrink: 0;
  }
  .logout-btn:hover {
    background: rgba(248,113,113,0.12);
    color: var(--red);
  }
  .logout-btn .ico {
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .logout-btn svg.lucide { width: 16px; height: 16px; }

  /* ============================================================
     IFRAME
     ============================================================ */
  .frame-wrap {
    flex: 1;
    min-height: 0;
    position: relative;
  }
  .app-iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: var(--bg);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .app-iframe.active {
    opacity: 1;
    pointer-events: auto;
  }

  /* ============================================================
     BOOT
     ============================================================ */
  .boot {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 1;
    transition: opacity 0.3s ease;
  }
  .boot.hide { opacity: 0; pointer-events: none; }
  .boot-spin {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 2.5px solid var(--bg-3);
    border-top-color: var(--blue);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ============================================================
     TOASTS
     ============================================================ */
  .toasts {
    position: fixed;
    bottom: 16px;
    right: 16px;
    z-index: 600;
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-width: 340px;
    pointer-events: none;
  }
  .toast {
    padding: 10px 14px;
    background: var(--bg-3);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    gap: 10px;
    pointer-events: auto;
    animation: tin 0.2s ease;
  }
  .toast svg.lucide { width: 15px; height: 15px; flex-shrink: 0; }
  .toast.error { border-color: rgba(248,113,113,0.4); color: var(--red); }
  .toast.success { border-color: rgba(74,222,128,0.4); color: var(--green); }
  @keyframes tin {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }

  /* ============================================================
     MODAL
     ============================================================ */
  .modal-bg {
    position: fixed;
    inset: 0;
    z-index: 700;
    background: rgba(0,0,0,0.62);
    -webkit-backdrop-filter: blur(5px);
    backdrop-filter: blur(5px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease;
  }
  .modal-bg.open { opacity: 1; pointer-events: auto; }

  .modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    width: 100%;
    max-width: 380px;
    padding: 22px 22px 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.55);
    transform: translateY(8px) scale(0.98);
    transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .modal-bg.open .modal { transform: none; }

  .m-ico {
    width: 40px;
    height: 40px;
    border-radius: 11px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: rgba(248,113,113,0.1);
    border: 1px solid rgba(248,113,113,0.22);
    color: var(--red);
    margin-bottom: 12px;
  }
  .m-ico svg.lucide { width: 19px; height: 19px; }

  .m-title {
    font-size: 15.5px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.01em;
    margin-bottom: 5px;
  }
  .m-text {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.5;
    margin-bottom: 18px;
  }
  .m-actions {
    display: flex;
    gap: 6px;
    justify-content: flex-end;
  }
  .m-btn {
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--bg-3);
    color: var(--text);
    transition: background 0.12s, border-color 0.12s, color 0.12s;
    -webkit-tap-highlight-color: transparent;
  }
  .m-btn:hover { background: var(--card-hover); border-color: #3a3a40; }
  .m-btn.danger {
    background: rgba(248,113,113,0.12);
    border-color: rgba(248,113,113,0.28);
    color: var(--red);
  }
  .m-btn.danger:hover {
    background: rgba(248,113,113,0.2);
    border-color: rgba(248,113,113,0.45);
  }

  /* ============================================================
     MOBILE
     ============================================================ */
  @media (max-width: 820px) {
    .topbar {
      padding-left: 8px;
      padding-right: 8px;
      gap: 0;
    }
    .brand {
      padding: 4px 6px 4px 0;
      margin-right: 0;
    }
    .brand .name { display: none; }

    .nav {
      gap: 0;
      padding: 0 4px;
    }
    .tab {
      padding: 8px 10px;
      gap: 0;
    }
    .tab .lbl { display: none; }

    .topbar-right {
      padding-left: 6px;
      margin-left: 0;
    }
    .logout-btn {
      padding: 8px 10px;
      gap: 0;
    }
    .logout-btn .lbl { display: none; }

    .toasts {
      left: 12px;
      right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      max-width: none;
    }
    .toast { max-width: none; width: 100%; }
  }
</style>
</head>
<body>

<!-- BOOT -->
<div class="boot" id="boot">
  <div class="boot-spin"></div>
</div>

<!-- TOP BAR -->
<header class="topbar">
  <div class="brand">
    <span class="mark"><i data-lucide="graduation-cap"></i></span>
    <span class="name">Smartschool</span>
  </div>

  <nav class="nav">
    <button class="tab" data-page="messages">
      <span class="ico"><i data-lucide="mail"></i></span>
      <span class="lbl">Berichten</span>
    </button>
    <button class="tab" data-page="tasks">
      <span class="ico"><i data-lucide="check-square"></i></span>
      <span class="lbl">Taken</span>
    </button>
    <button class="tab" data-page="planner">
      <span class="ico"><i data-lucide="calendar-days"></i></span>
      <span class="lbl">Planner</span>
    </button>
    <button class="tab" data-page="grades">
      <span class="ico"><i data-lucide="graduation-cap"></i></span>
      <span class="lbl">Cijfers</span>
    </button>
  </nav>

  <div class="topbar-right">
    <button class="logout-btn" id="logout-btn" title="Afmelden">
      <span class="ico"><i data-lucide="log-out"></i></span>
      <span class="lbl">Afmelden</span>
    </button>
  </div>
</header>

<!-- IFRAME -->
<div class="frame-wrap">
  <iframe class="app-iframe" id="frame" title="App"></iframe>
</div>

<!-- TOASTS -->
<div class="toasts" id="toasts"></div>

<!-- MODAL -->
<div class="modal-bg" id="modal-bg">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="m-ico" id="m-ico"><i data-lucide="log-out"></i></div>
    <div class="m-title" id="m-title">Afmelden?</div>
    <div class="m-text" id="m-text">Je opgeslagen inloggegevens worden gewist.</div>
    <div class="m-actions">
      <button class="m-btn" id="m-cancel">Annuleren</button>
      <button class="m-btn danger" id="m-ok">Afmelden</button>
    </div>
  </div>
</div>

<script>
'use strict';

const $ = id => document.getElementById(id);

const PAGES = ['messages', 'tasks', 'planner', 'grades'];
const DEFAULT_PAGE = 'messages';

/* ============================================================
   ICONS
   ============================================================ */
function refreshIcons() {
  if (window.lucide?.createIcons) {
    try { window.lucide.createIcons(); } catch {}
  }
}
if (typeof window.lucide === 'undefined') {
  let n = 0;
  const iv = setInterval(() => {
    n++;
    if (window.lucide || n > 40) { clearInterval(iv); refreshIcons(); }
  }, 100);
}

/* ============================================================
   TOASTS
   ============================================================ */
function toast(msg, type = '') {
  const wrap = $('toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const ic = type === 'error' ? 'alert-circle' : type === 'success' ? 'check-circle' : 'info';
  el.innerHTML = `<i data-lucide="${ic}"></i><span>${escHtml(msg)}</span>`;
  wrap.appendChild(el);
  refreshIcons();
  setTimeout(() => {
    el.style.transition = 'opacity 0.2s, transform 0.2s';
    el.style.opacity = '0';
    el.style.transform = 'translateY(6px)';
    setTimeout(() => el.remove(), 220);
  }, 3200);
}
function escHtml(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]
  ));
}

/* ============================================================
   MODAL
   ============================================================ */
function confirmModal({ title, text, okLabel, danger = false, icon = 'alert-circle' }) {
  return new Promise(resolve => {
    const bg = $('modal-bg');
    const ico = $('m-ico');
    ico.innerHTML = `<i data-lucide="${icon}"></i>`;
    ico.style.background  = danger ? 'rgba(248,113,113,0.1)' : 'rgba(96,165,250,0.1)';
    ico.style.borderColor = danger ? 'rgba(248,113,113,0.22)' : 'rgba(96,165,250,0.22)';
    ico.style.color       = danger ? 'var(--red)' : 'var(--blue)';
    $('m-title').textContent = title || 'Bevestigen';
    $('m-text').textContent  = text || '';
    const okBtn = $('m-ok');
    okBtn.textContent = okLabel || 'Bevestigen';
    okBtn.classList.toggle('danger', danger);
    refreshIcons();

    bg.classList.add('open');

    function done(v) {
      bg.classList.remove('open');
      okBtn.removeEventListener('click', onOk);
      $('m-cancel').removeEventListener('click', onCancel);
      bg.removeEventListener('click', onBg);
      document.removeEventListener('keydown', onKey);
      resolve(v);
    }
    function onOk() { done(true); }
    function onCancel() { done(false); }
    function onBg(e) { if (e.target === bg) done(false); }
    function onKey(e) {
      if (e.key === 'Escape') done(false);
      else if (e.key === 'Enter') done(true);
    }
    okBtn.addEventListener('click', onOk);
    $('m-cancel').addEventListener('click', onCancel);
    bg.addEventListener('click', onBg);
    document.addEventListener('keydown', onKey);
    setTimeout(() => okBtn.focus(), 50);
  });
}

/* ============================================================
   CREDS
   ============================================================ */
function hasCreds() {
  try {
    const raw = localStorage.getItem('ss_creds');
    if (!raw) return false;
    const o = JSON.parse(raw);
    return !!(o && o.username && o.password && o.main_url);
  } catch { return false; }
}

/* ============================================================
   NAVIGATIE
   ============================================================ */
let currentPage = null;

function setActive(page) {
  document.querySelectorAll('.tab').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page);
  });
}

function loadPage(page) {
  if (!PAGES.includes(page)) page = DEFAULT_PAGE;
  if (currentPage === page) return;
  currentPage = page;

  const frame = $('frame');
  frame.classList.remove('active');
  frame.src = page + '.html';
  frame.onload = () => {
    frame.classList.add('active');
    refreshIcons();
  };

  setActive(page);
  try { history.replaceState(null, '', '#' + page); } catch {}
}

/* ============================================================
   LOGIN
   ============================================================ */
let loginPoll = null;

function showLogin() {
  document.body.classList.add('login-mode');
  const frame = $('frame');
  frame.src = 'login.html';
  frame.onload = () => frame.classList.add('active');
  setActive(null);

  if (loginPoll) clearInterval(loginPoll);
  loginPoll = setInterval(() => {
    if (hasCreds()) {
      clearInterval(loginPoll);
      loginPoll = null;
      document.body.classList.remove('login-mode');
      const frame = $('frame');
      frame.classList.remove('active');
      setTimeout(() => {
        const hash = (location.hash || '').replace('#', '');
        loadPage(PAGES.includes(hash) ? hash : DEFAULT_PAGE);
      }, 220);
    }
  }, 1000);
}

function startApp() {
  document.body.classList.remove('login-mode');
  const hash = (location.hash || '').replace('#', '');
  loadPage(PAGES.includes(hash) ? hash : DEFAULT_PAGE);
}

/* ============================================================
   HASH
   ============================================================ */
window.addEventListener('hashchange', () => {
  if (!hasCreds()) return;
  const hash = (location.hash || '').replace('#', '');
  if (PAGES.includes(hash) && hash !== currentPage) loadPage(hash);
});

/* ============================================================
   INIT
   ============================================================ */
function init() {
  refreshIcons();

  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => loadPage(btn.dataset.page));
  });

  $('logout-btn').addEventListener('click', async () => {
    const ok = await confirmModal({
      title: 'Afmelden?',
      text: 'Je opgeslagen inloggegevens worden gewist en je keert terug naar het login-scherm.',
      okLabel: 'Afmelden',
      danger: true,
      icon: 'log-out',
    });
    if (!ok) return;
    try { localStorage.removeItem('ss_creds'); } catch {}
    location.reload();
  });

  setTimeout(() => {
    $('boot').classList.add('hide');
    if (hasCreds()) startApp();
    else showLogin();
  }, 200);
}

init();
window.addEventListener('load', refreshIcons);
document.addEventListener('DOMContentLoaded', refreshIcons);
</script>
</body>
</html>

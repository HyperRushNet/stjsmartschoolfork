<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Smartschool</title>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root {
    --bg:         #0d0d0f;
    --bg-2:       #121214;
    --bg-3:       #1a1a1d;
    --card:       #141416;
    --card-hover: #1c1c1f;
    --border:     #262629;
    --border-soft:#1d1d20;
    --text:       #e4e4e6;
    --text-dim:   #8a8a8e;
    --text-faint: #5a5a5e;
    --accent:     #2e2e33;
    --accent-hover:#3a3a40;
    --accent-soft: rgba(255,255,255,0.05);
    --green:      #4ade80;
    --red:        #f87171;
    --blue:       #60a5fa;
    --purple:     #c084fc;
    --radius:     14px;
    --radius-sm:  9px;
    --shadow:     0 4px 24px rgba(0,0,0,0.55);
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', system-ui, sans-serif;

    --sidebar-w: 64px;
    --sidebar-w-expanded: 220px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; width: 100%; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    display: flex;
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #333338; }

  svg.lucide { width: 16px; height: 16px; stroke-width: 2; }

  /* ============================================================
     SIDEBAR
     ============================================================ */
  .sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: var(--card);
    border-right: 1px solid var(--border-soft);
    display: flex;
    flex-direction: column;
    transition: width 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    overflow: hidden;
    z-index: 100;
    position: relative;
  }
  .sidebar:hover,
  .sidebar.expanded {
    width: var(--sidebar-w-expanded);
  }

  .sidebar-logo {
    height: 60px;
    display: flex;
    align-items: center;
    padding: 0 18px;
    gap: 12px;
    border-bottom: 1px solid var(--border-soft);
    flex-shrink: 0;
    overflow: hidden;
    white-space: nowrap;
  }
  .sidebar-logo .logo-mark {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: linear-gradient(135deg, #2a2a2e 0%, #1f1f23 100%);
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--border);
    flex-shrink: 0;
    color: var(--blue);
  }
  .sidebar-logo .logo-mark svg.lucide { width: 16px; height: 16px; }
  .sidebar-logo .logo-text {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.01em;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .sidebar:hover .sidebar-logo .logo-text,
  .sidebar.expanded .sidebar-logo .logo-text {
    opacity: 1;
    transition-delay: 0.08s;
  }

  .sidebar-nav {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 10px 8px;
    overflow-y: auto;
    overflow-x: hidden;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 9px;
    color: var(--text-dim);
    background: transparent;
    border: none;
    cursor: pointer;
    font-family: var(--font);
    font-size: 13.5px;
    font-weight: 500;
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    transition: background 0.15s, color 0.15s;
    text-decoration: none;
    position: relative;
    flex-shrink: 0;
  }
  .nav-item:hover {
    background: var(--bg-3);
    color: var(--text);
  }
  .nav-item.active {
    background: var(--accent);
    color: var(--text);
  }
  .nav-item.active::before {
    content: '';
    position: absolute;
    left: -8px;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 20px;
    border-radius: 0 3px 3px 0;
    background: var(--blue);
  }
  .nav-item .nav-icon {
    width: 24px;
    height: 24px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .nav-item .nav-icon svg.lucide {
    width: 18px; height: 18px;
    stroke-width: 2;
  }
  .nav-item .nav-label {
    opacity: 0;
    transition: opacity 0.15s;
  }
  .sidebar:hover .nav-item .nav-label,
  .sidebar.expanded .nav-item .nav-label {
    opacity: 1;
    transition-delay: 0.08s;
  }

  /* Tooltip voor ingeklapte state */
  .nav-item::after {
    content: attr(data-tooltip);
    position: absolute;
    left: 100%;
    top: 50%;
    transform: translateY(-50%);
    margin-left: 14px;
    background: var(--bg-3);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 10px;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 200;
    box-shadow: var(--shadow);
  }
  .sidebar:not(:hover):not(.expanded) .nav-item:hover::after {
    opacity: 1;
  }

  .sidebar-foot {
    padding: 8px;
    border-top: 1px solid var(--border-soft);
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex-shrink: 0;
  }

  /* ============================================================
     MAIN AREA — iframe container
     ============================================================ */
  .app-main {
    flex: 1;
    min-width: 0;
    background: var(--bg);
    position: relative;
    overflow: hidden;
  }

  .app-iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: var(--bg);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .app-iframe.active {
    opacity: 1;
    pointer-events: auto;
  }

  /* ============================================================
     LOADING SCREEN voor de allereerste init
     ============================================================ */
  .boot-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 500;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    opacity: 1;
    transition: opacity 0.4s ease;
  }
  .boot-overlay.hide {
    opacity: 0;
    pointer-events: none;
  }
  .boot-spinner {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 3px solid var(--bg-3);
    border-top-color: var(--blue);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ============================================================
     SIDEBAR verbergen tot login ok
     ============================================================ */
  .sidebar {
    transform: translateX(-100%);
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                width 0.25s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .sidebar.ready {
    transform: translateX(0);
  }

  /* ============================================================
     MOBILE — sidebar wordt bottom-bar? Nee, hou compact
     ============================================================ */
  @media (max-width: 820px) {
    :root { --sidebar-w: 56px; }
    .sidebar-logo { padding: 0 14px; }
    .nav-item { padding: 10px; justify-content: center; }
    .sidebar:hover, .sidebar.expanded { width: var(--sidebar-w); }
    .sidebar:hover .nav-item .nav-label,
    .sidebar.expanded .nav-item .nav-label,
    .sidebar:hover .sidebar-logo .logo-text,
    .sidebar.expanded .sidebar-logo .logo-text { opacity: 0; }
    .nav-item::after { display: none; }
  }
</style>
</head>
<body>

<!-- Boot overlay (heel even zichtbaar tot we weten of er creds zijn) -->
<div class="boot-overlay" id="boot-overlay">
  <div class="boot-spinner"></div>
</div>

<!-- Sidebar (verborgen tot ready) -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <span class="logo-mark"><i data-lucide="graduation-cap"></i></span>
    <span class="logo-text">Smartschool</span>
  </div>

  <nav class="sidebar-nav" id="sidebar-nav">
    <button class="nav-item" data-page="messages" data-tooltip="Berichten">
      <span class="nav-icon"><i data-lucide="mail"></i></span>
      <span class="nav-label">Berichten</span>
    </button>
    <button class="nav-item" data-page="tasks" data-tooltip="Taken">
      <span class="nav-icon"><i data-lucide="check-square"></i></span>
      <span class="nav-label">Taken</span>
    </button>
    <button class="nav-item" data-page="planner" data-tooltip="Planner">
      <span class="nav-icon"><i data-lucide="calendar-days"></i></span>
      <span class="nav-label">Planner</span>
    </button>
    <button class="nav-item" data-page="grades" data-tooltip="Cijfers">
      <span class="nav-icon"><i data-lucide="graduation-cap"></i></span>
      <span class="nav-label">Cijfers</span>
    </button>
  </nav>

  <div class="sidebar-foot">
    <button class="nav-item" data-page="__logout" data-tooltip="Afmelden">
      <span class="nav-icon"><i data-lucide="log-out"></i></span>
      <span class="nav-label">Afmelden</span>
    </button>
  </div>
</aside>

<!-- Main -->
<main class="app-main" id="app-main">
  <iframe class="app-iframe" id="app-iframe" title="Smartschool app"></iframe>
</main>

<script>
'use strict';

const $  = id => document.getElementById(id);

const PAGES = ['messages', 'tasks', 'planner', 'grades'];
const DEFAULT_PAGE = 'messages';

/* ============================================================
   ICONS
   ============================================================ */
function refreshIcons() {
  if (window.lucide && typeof window.lucide.createIcons === 'function') {
    window.lucide.createIcons();
  }
}

/* ============================================================
   LOCALSTORAGE CHECK
   ============================================================ */
function hasCreds() {
  try {
    const raw = localStorage.getItem('ss_creds');
    if (!raw) return false;
    const obj = JSON.parse(raw);
    return !!(obj && obj.username && obj.password && obj.main_url);
  } catch {
    return false;
  }
}

/* ============================================================
   NAVIGATIE
   ============================================================ */
let currentPage = null;

function setActiveNav(page) {
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page);
  });
}

function loadPage(page) {
  if (!PAGES.includes(page)) page = DEFAULT_PAGE;
  if (currentPage === page) return;
  currentPage = page;

  const iframe = $('app-iframe');
  iframe.classList.remove('active');
  iframe.src = page + '.html';
  iframe.onload = () => {
    iframe.classList.add('active');
    refreshIcons();
  };

  setActiveNav(page);

  // Update URL hash zodat refresh dezelfde pagina toont
  try { history.replaceState(null, '', '#' + page); } catch {}
}

/* ============================================================
   SIDEBAR EVENTS
   ============================================================ */
function setupNav() {
  document.querySelectorAll('.nav-item[data-page]').forEach(btn => {
    btn.addEventListener('click', () => {
      const page = btn.dataset.page;

      if (page === '__logout') {
        if (confirm('Afmelden en inloggegevens wissen?')) {
          try { localStorage.removeItem('ss_creds'); } catch {}
          location.reload();
        }
        return;
      }

      loadPage(page);
    });
  });
}

/* ============================================================
   LOGIN FLOW
   ============================================================ */
let loginPollTimer = null;

function showLoginIframe() {
  // Laad login.html in de iframe
  const iframe = $('app-iframe');
  iframe.src = 'login.html';
  iframe.onload = () => {
    iframe.classList.add('active');
  };

  // Sidebar verbergen
  $('sidebar').classList.remove('ready');

  // Poll elke seconde of creds er in staan
  if (loginPollTimer) clearInterval(loginPollTimer);
  loginPollTimer = setInterval(() => {
    if (hasCreds()) {
      clearInterval(loginPollTimer);
      loginPollTimer = null;

      // Creds staan erin → fade login weg en start de app
      const iframe = $('app-iframe');
      iframe.classList.remove('active');

      // Korte delay voor de fade-out, dan laden we de default page
      setTimeout(() => {
        // Sidebar tonen
        $('sidebar').classList.add('ready');

        // Start op de hash of default page
        const hash = (location.hash || '').replace('#', '');
        const page = PAGES.includes(hash) ? hash : DEFAULT_PAGE;
        loadPage(page);
      }, 260);
    }
  }, 1000);
}

function startApp() {
  // Creds aanwezig → sidebar tonen + app laden
  $('sidebar').classList.add('ready');

  const hash = (location.hash || '').replace('#', '');
  const page = PAGES.includes(hash) ? hash : DEFAULT_PAGE;
  loadPage(page);
}

/* ============================================================
   HASH CHANGE — ondersteunt back/forward
   ============================================================ */
window.addEventListener('hashchange', () => {
  if (!hasCreds()) return;
  const hash = (location.hash || '').replace('#', '');
  if (PAGES.includes(hash) && hash !== currentPage) {
    loadPage(hash);
  }
});

/* ============================================================
   INIT
   ============================================================ */
function init() {
  refreshIcons();
  setupNav();

  // Boot overlay weghalen zodra we weten wat te doen
  setTimeout(() => {
    $('boot-overlay').classList.add('hide');

    if (hasCreds()) {
      startApp();
    } else {
      showLoginIframe();
    }
  }, 250);
}

init();
</script>
</body>
</html>
